name: art-visions-tunisia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avtn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: avtn
    ports: ["127.0.0.1:5455:5432"]
    volumes: [avtn_db:/var/lib/postgresql/data]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    ports: ["127.0.0.1:9150:9000", "127.0.0.1:9151:9101"]
    volumes: [avtn_minio:/data]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://avtn:${POSTGRES_PASSWORD}@db:5432/avtn
    depends_on: [db]
    ports: ["127.0.0.1:3100:3000"]

volumes:
  avtn_db:
  avtn_minio:
